# CI for the monorepo: the backend (lint, types, migrations both ways, the three
# pytest suites, the OpenAPI document, the image) and the two portals
# (typecheck, lint, unit tests, production build).
#
# Lives at the repository root because GitHub reads workflows from
# `.github/workflows` at the root only. It sat under `cmp_backend/` from
# August to September 2026 and never ran; a review noticed zero runs.
#
# Two things this pipeline does that a default one does not:
#
# 1. **It runs the integration tests against a real PostgreSQL.** The constraints
#    in migration 0002 are the enforcement layer; testing them against a mock
#    tests the mock. The empty-array CHECK bug fixed in 0004 was only findable
#    against a real database.
#
# 2. **It exercises the migrations in both directions.** `upgrade -> downgrade ->
#    upgrade` proves the rollback path works *before* it is needed at 2am, which
#    is the only time anyone finds out otherwise.

name: CI

on:
  push:
    branches: [main, refactor/frontend-architecture]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

permissions:
  contents: read

defaults:
  run:
    working-directory: cmp_backend

jobs:
  quality:
    name: Backend lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: cmp_backend/uv.lock

      - run: uv python install ${{ env.PYTHON_VERSION }}

      # --frozen: fail if uv.lock does not match pyproject.toml, rather than
      # resolving something nobody has tested.
      - name: Install
        run: uv sync --frozen --all-extras --dev

      - name: Lint
        run: uv run ruff check src tests migrations scripts --output-format=github

      - name: Format check
        run: uv run ruff format --check src tests migrations scripts

      - name: Type check
        run: uv run mypy src

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cmp
          POSTGRES_USER: cmp
          POSTGRES_PASSWORD: cmp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cmp -d cmp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: cmp
      POSTGRES_USER: cmp
      POSTGRES_PASSWORD: cmp
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SECRET_KEY: ci-secret-key-at-least-thirty-two-bytes
      COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: cmp_backend/uv.lock

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-extras --dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      # The rollback path, exercised on every commit rather than discovered
      # during an incident.
      - name: Migrations are reversible
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      # The committed API document must be the one the code produces. A stale
      # openapi.json means the portals' generated types were checked against
      # something the server no longer says.
      - name: OpenAPI document is current
        run: |
          uv run python -c "from cmp.main import app; import json; json.dump(app.openapi(), open('openapi.generated.json','w'), indent=2)"
          diff -q openapi.json openapi.generated.json

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Integration tests
        run: uv run pytest tests/integration -q

      - name: Security tests
        run: uv run pytest tests/security -q

      - name: Full suite with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml -q

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: cmp_backend/coverage.xml
          retention-days: 7

  portals:
    name: ${{ matrix.portal }} typecheck, lint, tests, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        portal: [cmp_internal_ui, cmp_public_ui]
    defaults:
      run:
        working-directory: ${{ matrix.portal }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.portal }}/package-lock.json

      - name: Install
        run: npm ci

      # typecheck + lint + vitest, the same gate a developer runs locally.
      - name: Verify
        run: npm run verify

      # The production build fails on a type or lint error the dev server
      # tolerates, so it is part of the gate rather than of the deploy.
      - name: Build
        run: npm run build

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs history to scan it

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: cmp_backend/uv.lock

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-extras --dev

      # Known CVEs in the locked dependency set.
      - name: Audit dependencies
        # Against the exported lock, not the environment: pip-audit refuses the
        # project itself, which `uv sync` installs as an editable distribution
        # that is not on PyPI, and stops there without auditing anything.
        run: |
          uv export --no-emit-project --no-hashes --all-extras -o requirements-audit.txt
          uv run pip-audit --strict --desc -r requirements-audit.txt

      # Bandit rules are already part of ruff's `S` selection, so this step is
      # the belt to that pipeline's braces rather than a duplicate.
      - name: Static security scan
        # `--ignore S101` restated here: any selector given on the command line
        # re-enables S101 over the ignore in pyproject, and this codebase
        # uses `assert` for RETURNING invariants on purpose - see the note there.
        run: uv run ruff check src --extend-select S --ignore S101 --output-format=github

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Build and scan the API image
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          # The build context is the backend directory: that is where src/,
          # migrations/ and the lockfile the Dockerfile copies live.
          context: cmp_backend
          file: cmp_backend/docker/Dockerfile
          push: false
          load: true
          tags: cmp-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A vulnerable base image is a vulnerable deployment, however clean the
      # application code is.
      - name: Scan the image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cmp-api:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

      # The image must start, and must fail fast without a database. Both are
      # asserted: a container that exits on boot is a broken deploy, and one
      # that keeps serving 503s with no datastore is a broken one that looks
      # alive. Printing the logs is not a check; the exit code and the log
      # line are.
      - name: Smoke test the image
        working-directory: .
        run: |
          set -euo pipefail
          docker run -d --name smoke \
            -e ENVIRONMENT=local \
            -e POSTGRES_HOST=nowhere \
            -e POSTGRES_PASSWORD=smoke \
            -e SECRET_KEY=smoke-secret-key-at-least-thirty-two-bytes \
            cmp-api:${{ github.sha }}
          sleep 15
          status=$(docker inspect -f '{{.State.Status}}' smoke)
          exit_code=$(docker inspect -f '{{.State.ExitCode}}' smoke)
          docker logs smoke 2>&1 | tail -20
          docker rm -f smoke
          if [ "$status" != "exited" ] || [ "$exit_code" = "0" ]; then
            echo "expected the container to exit non-zero without a database; got status=$status exit=$exit_code"
            exit 1
          fi
