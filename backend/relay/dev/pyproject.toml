# This machine only, never deployed: the emulator's queues and the end-to-end test.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmp-relay-dev"
version = "0.1.0"
description = "COMPASS public-ingress relay: local tools, never deployed"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }
# One portion of the cmp_relay namespace (no __init__.py): the parts installed
# on a host merge into one package, so `python -m cmp_relay.bridge` and
# `from cmp_relay import sealing` read the same wherever they run.
packages = ["cmp_relay"]
