# The bridge: AWS, on each portal instance. Installed with ../common beside it.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmp-relay-bridge"
version = "0.1.0"
description = "COMPASS public-ingress relay: the bridge, beside the portal on AWS"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
package-dir = { "" = "src" }
# One portion of the cmp_relay namespace (no __init__.py): the parts installed
# on a host merge into one package, so `python -m cmp_relay.bridge` and
# `from cmp_relay import sealing` read the same wherever they run.
packages = ["cmp_relay"]
