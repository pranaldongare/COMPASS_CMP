# Tooling configuration only. The dependencies are in requirements.txt, because
# this service is installed with `pip install -r`, not built as a package.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S", "T20"]
ignore = [
    "S101",   # assert - the suite, and the type-id invariants in types.py
    "B008",   # Depends() in a default is FastAPI's documented idiom
    # Exceptions here are named for what happened, as they are in backend/api:
    # `raise BulkFailed(errors)` reads better at the call site than
    # `BulkFailedError`, and they are never caught as generic errors.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
